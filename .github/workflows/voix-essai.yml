name: Voix (essai de prononciation)

# Essai temporaire : prononciation des sons mesurée phonème par phonème (scripts/voix/essai-phonemes.py).
# Les sons d'essai sont déposés sous l'étiquette « voix-essai/<branche> ».
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/voix/essai-phonemes.py', 'scripts/voix/phonemes.py', '.github/workflows/voix-essai.yml']
  workflow_dispatch:

permissions:
  contents: write # pour l'étiquette voix-essai/<branche>

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
      - run: pip install pocket-tts transformers phonemizer --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/voix/essai-phonemes.py voix-essai
      - if: always()
        run: bash scripts/voix/publier.sh "voix-essai/${{ github.ref_name }}" voix-essai
        env:
          GITHUB_TOKEN: ${{ github.token }}
