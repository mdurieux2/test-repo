name: Voix (essai)

# Essai de voix naturelles gratuites, sur les phrases de scripts/voix/phrases-essai.json :
# Pocket TTS (Kyutai, français normal et grand modèle, anglais) et Chatterbox Multilingual
# (Resemble AI, avec le timbre de la voix « Estelle » de Pocket TTS). Les MP3 sont dans les
# artefacts de l'exécution, et sous les étiquettes git voix-essai-pocket et voix-essai-chatterbox
# (aucune branche n'est modifiée). Ne touche pas à l'application.
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/voix/**', '.github/workflows/voix-essai.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # pour l'étiquette voix-essai-pocket
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pocket-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/voix/essai_pocket.py voix-essai
      # un extrait de la voix « Estelle » sert de modèle de timbre à Chatterbox
      - run: cp voix-essai/pocket-fr/09.wav voix-essai/estelle-extrait.wav
      - run: bash scripts/voix/compiler.sh voix-essai/pocket-fr voix-essai/pocket-fr-24l voix-essai/pocket-en
      - uses: actions/upload-artifact@v4
        with:
          name: voix-pocket
          path: voix-essai
      - run: bash scripts/voix/publier.sh voix-essai-pocket voix-essai
        env:
          GITHUB_TOKEN: ${{ github.token }}

  chatterbox:
    needs: pocket
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # pour l'étiquette voix-essai-chatterbox
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: voix-pocket
          path: voix-pocket
      - run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/voix/essai_chatterbox.py voix-essai voix-pocket/estelle-extrait.wav
      - run: bash scripts/voix/compiler.sh voix-essai/chatterbox-fr
      - uses: actions/upload-artifact@v4
        with:
          name: voix-chatterbox
          path: voix-essai
      - run: bash scripts/voix/publier.sh voix-essai-chatterbox voix-essai
        env:
          GITHUB_TOKEN: ${{ github.token }}
